// Session restore
(function() {
    try {
        var session = JSON.parse(localStorage.getItem("biddut_session") || "null");
        if (session && session.loginTime && Date.now() - session.loginTime < 7 * 24 * 60 * 60 * 1000) {
            window.__savedSession = session;

            localStorage.removeItem("biddut_session");
        }
    } catch(e) {}
})();

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('service-worker.js').then(function(registration) {
                    console.log('ServiceWorker registration successful');
                }).catch(function(err) {
                    console.log('ServiceWorker registration failed: ', err);
                });
            });
        }

        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', function(e) {
            e.preventDefault();
            deferredPrompt = e;
            
            setTimeout(() => {
                if (confirm('এই অ্যাপ ইন্সটল করতে চান?')) {
                    deferredPrompt.prompt();
                    deferredPrompt.userChoice.then(function(choiceResult) {
                        if (choiceResult.outcome === 'accepted') {
                            console.log('User accepted the install prompt');
                        }
                        deferredPrompt = null;
                    });
                }
            }, 3000);
        });
    </script>

    <script>
// Initialize app - restore session and init Firebase
(function() {
    // Restore session if exists
    if (window.__savedSession && typeof APP !== "undefined") {
        var s = window.__savedSession;
        APP.currentUser = {id: s.userId, email: s.email, name: s.name, role: s.role || "user"};
        window.__savedSession = null;
        
        setTimeout(function() {
            document.getElementById("authPage").style.display = "none";
            document.getElementById("appPage").style.display = "block";
            if (APP.currentUser.role === "admin") document.getElementById("adminNav").style.display = "block";
            if (typeof updateSidebarUserInfo === "function") updateSidebarUserInfo();
            if (typeof loadFromCloud === "function") loadFromCloud().then(function() { navigateTo("dashboard"); });
            else if (typeof navigateTo === "function") navigateTo("dashboard");
        }, 200);
    }
    
    // Init Firebase
    if (typeof tryFirebaseInit === "function") {
        setTimeout(tryFirebaseInit, 1000);
    }
})();
</script>

<script>
// ==================== GLOBAL UTILITIES ====================
function escapeHtml(s){if(!s)return"";return s.replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/'/g,"&#039;").replace(/"/g,"&quot;");}

// ==================== SESSION RESTORE ====================
(function() {
    try {
        var s = JSON.parse(localStorage.getItem("biddut_session") || "null");
        if (s && s.loginTime && Date.now() - s.loginTime < 7 * 24 * 60 * 60 * 1000) {
            window.__savedSession = s;
            localStorage.removeItem("biddut_session"); // Clean up
        } else {
            localStorage.removeItem("biddut_session");
        }
    } catch(e) {}
    
    // Restore session immediately if saved
    if (window.__savedSession && typeof APP !== "undefined" && APP) {
        var s = window.__savedSession;
        APP.currentUser = { id: s.userId || "1", email: s.email || "", name: s.name || "User", role: s.role || "user" };
        window.__savedSession = null;
        
        var authEl = document.getElementById("authPage");
        var appEl = document.getElementById("appPage");
        var adminNav = document.getElementById("adminNav");
        
        if (authEl) authEl.style.display = "none";
        if (appEl) appEl.style.display = "block";
        if (adminNav && APP.currentUser.role === "admin") adminNav.style.display = "block";
        
        if (typeof updateSidebarUserInfo === "function") updateSidebarUserInfo();
        
        // Delay navigation to ensure everything is loaded
        setTimeout(function() {
            if (typeof loadFromCloud === "function") {
                loadFromCloud().then(function() {
                    if (typeof navigateTo === "function") navigateTo("dashboard");
                });
            } else if (typeof navigateTo === "function") {
                navigateTo("dashboard");
            }
        }, 500);
    }
})();
</script>
